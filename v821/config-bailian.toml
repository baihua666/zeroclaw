# V821 设备端配置 — 阿里百练 (qwen-code provider)
default_provider = "qwen-code"
default_model = "qwen3-coder-next"
default_temperature = 0.7
provider_timeout_secs = 120

[observability]
backend = "none"
runtime_trace_mode = "none"

[autonomy]
level = "supervised"
workspace_only = true
max_actions_per_hour = 20
max_cost_per_day_cents = 500

[security.sandbox]
backend = "auto"

[security.resources]
max_memory_mb = 512
max_cpu_time_seconds = 60
max_subprocesses = 10
memory_monitoring = true

[security.audit]
enabled = true
log_path = "audit.log"
max_size_mb = 100
sign_events = false

[security.otp]
enabled = false

[security.estop]
enabled = false

[security.nevis]
enabled = false

[runtime]
kind = "native"

[reliability]
provider_retries = 2
provider_backoff_ms = 500

[reliability.model_fallbacks]

[scheduler]
enabled = true
max_tasks = 64
max_concurrent = 4

[agent]
compact_context = false
max_tool_iterations = 10
max_history_messages = 50
max_context_tokens = 32000

[skills]
open_skills_enabled = false

[query_classification]
enabled = false

[heartbeat]
enabled = false
interval_minutes = 30
two_phase = true

[cron]
enabled = true
max_run_history = 50

[channels_config]
cli = true
message_timeout_secs = 300
# V821: 禁用 session 持久化，避免文件系统操作导致 signal 11
session_persistence = false

[channels_config.qq]
app_id = "1903829956"
app_secret = "Sdo0DQet8OevDVo8Sn8UrEc1QqHiAc5Z"
allowed_users = ["*"]

[memory]
backend = "sqlite"
auto_save = true
hygiene_enabled = true
embedding_provider = "none"
auto_hydrate = true

[tunnel]
provider = "none"

[gateway]
port = 9091
host = "0.0.0.0"
require_pairing = false
allow_public_bind = true

[secrets]
encrypt = true

[browser]
enabled = false

[http_request]
enabled = false

[web_fetch]
enabled = false

[web_search]
enabled = false

[proxy]
enabled = false

[cost]
enabled = false

[peripherals]
enabled = false

[hooks]
enabled = true

[hardware]
enabled = false

[transcription]
enabled = false

[tts]
enabled = false

[mcp]
enabled = false

[nodes]
enabled = false

[workspace]
enabled = false

[node_transport]
enabled = true